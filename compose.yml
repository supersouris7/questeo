# Épicadémie — déploiement de référence (une machine).
# Base, utilisateur PostgreSQL et volume « questeo » (ancien nom) conservés : les renommer casserait les
# déploiements existants (migration de données nécessaire).
#
#   cp .env.example .env   # puis renseigner POSTGRES_PASSWORD (et PUBLIC_URL)
#   docker compose up -d
#
# Ordre de démarrage : PostgreSQL (sain) → migration (terminée avec succès) → serveur.
# Voir docs/operations/deploiement.md.
services:
  db:
    image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    restart: unless-stopped
    environment:
      POSTGRES_DB: questeo
      POSTGRES_USER: questeo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire (fichier .env)}
    volumes:
      - questeo-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U questeo -d questeo']
      interval: 5s
      timeout: 3s
      retries: 20

  # Applique les migrations puis s'arrête (même image que le serveur).
  migrate:
    image: ${EPICADEMIE_IMAGE:-epicademie:local}
    build: .
    command: ['node', 'server/dist/migrate.js']
    environment:
      DATABASE_URL: postgres://questeo:${POSTGRES_PASSWORD}@db:5432/questeo
      # La configuration est validée aussi ici : mêmes règles de production que le serveur.
      APP_ENV: ${APP_ENV:-}
      # Portail de connexion placé devant la plateforme : sa page de déconnexion (facultatif).
      PORTAL_LOGOUT_URL: ${PORTAL_LOGOUT_URL:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  epicademie:
    image: ${EPICADEMIE_IMAGE:-epicademie:local}
    build: .
    restart: unless-stopped
    ports:
      - '${EPICADEMIE_PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgres://questeo:${POSTGRES_PASSWORD}@db:5432/questeo
      # URL utilisée dans le QR code de connexion des appareils.
      # En conteneur, l'IP détectée est celle du réseau Docker : renseignez l'IP de la machine hôte.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # 1 si un proxy (nginx…) est placé devant : IP client réelle pour la limite de débit.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Administration : secret (32 caractères min.) que le frontal de la page de pilotage ajoute
      # (en-tête X-Epicademie-Operateur). Vide : aucune administration. Voir docs/adr/0033-….
      ADMIN_OPERATOR_SECRET: ${ADMIN_OPERATOR_SECRET:-}
      # Connexion de l'équipe par OpenID Connect (remplace le secret ci-dessus) ; voir docs/adr/0036-….
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-}
      ADMIN_SECOURS_SECRET: ${ADMIN_SECOURS_SECRET:-}
      # E-mails de validation (Brevo) et connexion Google : voir docs/operations/configuration.md.
      # Production : BREVO_API_KEY obligatoire ; recette sans fournisseur : APP_ENV=recette.
      APP_ENV: ${APP_ENV:-}
      # Portail de connexion placé devant la plateforme : déconnexion, et connexion directe (recette seule).
      PORTAL_LOGOUT_URL: ${PORTAL_LOGOUT_URL:-}
      PORTAL_LOGIN: ${PORTAL_LOGIN:-}
      PORTAL_PROXY_SECRET: ${PORTAL_PROXY_SECRET:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  questeo-pg:
